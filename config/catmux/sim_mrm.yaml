---
# MRM simulator (fake nominal + MRM in hot standby), campus map. Set the initial pose in RViz and switch to autonomous mode.
# Start (in the container): catmux_create_session -L default config/catmux/sim_mrm.yaml
# Windows: Ctrl-b 1..5 or click. Detach: Ctrl-b d. Back: tmux attach (or the docker exec command in docs/setup.md).
parameters:
  mabx: false   # true: also send trajectory, status and trigger to the MicroAutoBox 10.0.10.20 (bench test, car parked!)
  bag_prefix: sim_mrm
common:
  default_window: stack
windows:
  - name: stack
    unless: mabx
    commands:
      - ros2 launch autoware_launch mrm_planning_simulator.launch.xml map_path:=/home/aw/autoware_data/maps/autoware_maps/campus_ost vehicle_model:=ioniq5_vehicle sensor_model:=ioniq5_sensor_kit path_file:=$(ros2 pkg prefix mrm_sim_tools)/share/mrm_sim_tools/config/paths/campus_ost_lanelet_1903750.yaml
  - name: stack
    if: mabx
    commands:
      - ros2 launch autoware_launch mrm_planning_simulator.launch.xml map_path:=/home/aw/autoware_data/maps/autoware_maps/campus_ost vehicle_model:=ioniq5_vehicle sensor_model:=ioniq5_sensor_kit path_file:=$(ros2 pkg prefix mrm_sim_tools)/share/mrm_sim_tools/config/paths/campus_ost_lanelet_1903750.yaml autobox_ip:=10.0.10.20
  - name: trigger
    commands:
      - >-
        history -s 'ros2 topic pub --times 3 /mrm/trigger std_msgs/msg/Bool "{data: true}"'
      - >-
        echo 'MRM trigger: press Up, then Enter (or RViz "Set Emergency"). Latched until the stack restarts.'
  - name: status
    commands:
      - until ros2 topic echo /mrm/status --field message; do sleep 2; done
  - name: bag
    commands:
      - history -s 'ros2 bag record -o log/bags/${bag_prefix}_$(date +%Y-%m-%d_%H%M%S) /mrm/trajectory /mrm/status /mrm/trigger /planning/trajectory /localization/kinematic_state /perception/object_recognition/objects /HI5/autoware_controller_trajectory'
      - >-
        echo 'rosbag: press Up, then Enter. Ctrl-C stops it. Bags go to log/bags/ in the repo (git-ignored).'
  - name: shell
    commands:
      - echo "ROS_DOMAIN_ID=$ROS_DOMAIN_ID"
