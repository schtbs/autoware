# tmux in the Autoware container (installed as /etc/tmux.conf)
set -g mouse on                  # click panes/windows, scroll the output with the wheel
set -g history-limit 50000       # long launch logs
set -g base-index 1              # windows 1, 2, 3 ... (Ctrl-b 1 is the first window)
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -g status-style "bg=colour24,fg=white"
# show the ROS domain in the status bar: 101 = car MRM stack, 0 = nominal system
set -g status-right "ROS_DOMAIN_ID=#(printenv ROS_DOMAIN_ID) | %H:%M "
set -g status-right-length 40
